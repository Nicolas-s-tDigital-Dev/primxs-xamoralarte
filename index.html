<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMXS - Próximo Lanzamiento</title>
    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial Black', Impact, sans-serif;
            text-transform: uppercase;
            text-align: center;
            overflow-x: hidden;
            cursor: none;
        }

        a, button, .video-item img {
            cursor: none !important;
        }

        /* Video de Fondo */
        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
            background-size: cover;
        }

        /* Estilos del Cursor Personalizado */
        .custom-cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #d10000;
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        .custom-cursor-dot {
            width: 4px;
            height: 4px;
            background-color: #ffffff;
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10000;
        }

        .custom-cursor.hover {
            width: 40px;
            height: 40px;
            background-color: rgba(209, 0, 0, 0.2);
            border-color: #ffffff;
        }

        /* Capa oscura de fondo para legibilidad, deja traslucir el video */
        .overlay {
            background: rgba(0, 0, 0, 0.55);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: -1;
        }

        header {
            padding: 50px 20px;
        }

        h1 {
            font-size: 5rem;
            letter-spacing: 8px;
            margin: 0;
            color: #f2f2f2;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
        }

        /* Sección del Contador */
        .countdown-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .subtitle {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: #d10000;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 4rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }

        .timer-box {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
        }

        .timer-box span.label {
            font-size: 1rem;
            color: #bbb;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .separator {
            line-height: 4rem;
            color: #888;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }

        /* Sección de Videos */
        .videos-section {
            padding: 60px 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(3px);
        }

        .video-grid {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .video-item {
            width: 100%;
            max-width: 400px;
        }

        .video-item img {
            width: 100%;
            border: 2px solid #222;
            transition: border-color 0.3s ease, transform 0.3s ease;
            display: block;
        }

        .video-item:hover img {
            border-color: #ffffff;
            transform: scale(1.02);
        }

        .watch-btn {
            display: block;
            margin-top: 15px;
            padding: 15px 20px;
            background: rgba(0,0,0,0.5);
            color: #ffffff;
            border: 2px solid #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .watch-btn:hover {
            background: #ffffff;
            color: #000000;
            font-weight: bold;
        }

        /* Instrucción para activar el sonido */
        .sound-notice {
            font-size: 0.8rem;
            color: #aaa;
            letter-spacing: 1px;
            margin-top: 20px;
            font-family: sans-serif;
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border-radius: 20px;
            text-shadow: none;
        }

        @media (max-width: 768px) {
            body, a, button, .video-item img { cursor: default !important; }
            .custom-cursor, .custom-cursor-dot { display: none; }
            h1 { font-size: 3.5rem; }
            .timer { font-size: 2.5rem; gap: 5px; }
            .timer-box { padding: 10px; }
            .subtitle { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Elementos del cursor personalizado -->
    <div class="custom-cursor" id="customCursor"></div>
    <div class="custom-cursor-dot" id="customCursorDot"></div>

    <!-- Video de Fondo de PRIMXS -->
    <video autoplay loop muted playsinline class="bg-video" id="bgVideo">
        <source src="mivideo.mp4" type="video/mp4">
        Tu navegador no soporta videos de fondo.
    </video>

    <div class="overlay">
        <header>
            <h1 class="nav-sound-trigger">PRIMXS</h1>
        </header>

        <main class="countdown-container">
            <div class="subtitle">PRÓXIMO LANZAMIENTO</div>
            <div class="timer" id="countdown">
                <div class="timer-box"><span id="days">00</span><span class="label">DÍAS</span></div>
                <div class="separator">:</div>
                <div class="timer-box"><span id="hours">00</span><span class="label">HRS</span></div>
                <div class="separator">:</div>
                <div class="timer-box"><span id="minutes">00</span><span class="label">MIN</span></div>
                <div class="separator">:</div>
                <div class="timer-box"><span id="seconds">00</span><span class="label">SEG</span></div>
            </div>
            <div class="sound-notice">HACÉ CLIC EN CUALQUIER PARTE PARA ACTIVAR EL AUDIO Y EL VIDEO</div>
        </main>

        <section class="videos-section">
            <div class="video-grid">
                <div class="video-item">
                    <a href="https://www.youtube.com/watch?v=4ASYY2629wY" target="_blank" class="nav-sound-trigger">
                        <img src="https://i.ytimg.com/vi/4ASYY2629wY/maxresdefault.jpg" alt="PRIMXS - HORARIO">
                    </a>
                    <a href="https://www.youtube.com/watch?v=4ASYY2629wY" target="_blank" class="watch-btn nav-sound-trigger">VER AHORA - HORARIO</a>
                </div>
                <div class="video-item">
                    <a href="https://www.youtube.com/watch?v=A1tJEHw_itU" target="_blank" class="nav-sound-trigger">
                        <img src="https://i.ytimg.com/vi/A1tJEHw_itU/maxresdefault.jpg" alt="PRIMXS // OILY SESH 06">
                    </a>
                    <a href="https://www.youtube.com/watch?v=A1tJEHw_itU" target="_blank" class="watch-btn nav-sound-trigger">VER AHORA - OILY SESH</a>
                </div>
            </div>
        </section>
    </div>

    <script>
        // --- CONTEXTO DE AUDIO GLOBAL Y VIDEO ---
        let audioCtx;
        let isAudioUnlocked = false;
        const bgVideo = document.getElementById('bgVideo');

        function initAudioAndVideo() {
            // Inicializar sintetizadores web
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioUnlocked = true;

            // ACTIVAR EL SONIDO DEL VIDEO DE FONDO
            if (bgVideo) {
                bgVideo.muted = false;
            }

            // Ocultar el aviso de interacción
            document.querySelector('.sound-notice').style.display = 'none'; 
        }

        // Desbloquear audio/video al primer clic en la pantalla
        document.body.addEventListener('click', initAudioAndVideo, { once: true });

        // --- LÓGICA DEL CURSOR ---
        const cursor = document.getElementById('customCursor');
        const dot = document.getElementById('customCursorDot');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
        });

        // --- SINTETIZADOR HOVER/CLICK ---
        function playDarkSynthSound(frequency, duration) {
            if (!isAudioUnlocked || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(frequency / 2, audioCtx.currentTime + duration);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        const soundElements = document.querySelectorAll('.nav-sound-trigger');
        soundElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                cursor.classList.add('hover');
                playDarkSynthSound(110, 0.12); 
            });
            element.addEventListener('mouseleave', () => {
                cursor.classList.remove('hover');
            });
            element.addEventListener('click', () => {
                playDarkSynthSound(80, 0.4);
            });
        });

        // --- SINTETIZADOR PARA EL "TICK" DEL RELOJ ---
        function playTickSound() {
            if (!isAudioUnlocked || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        // --- LÓGICA DEL CONTADOR ---
        var countDownDate = new Date();
        countDownDate.setDate(countDownDate.getDate() + 10);
        countDownDate = countDownDate.getTime();
        
        var lastSecond = -1;

        var x = setInterval(function() {
            var now = new Date().getTime();
            var distance = countDownDate - now;

            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            if (seconds !== lastSecond && lastSecond !== -1) {
                playTickSound();
            }
            lastSecond = seconds;

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<div style='font-size:3rem; color:#fff;'>¡YA DISPONIBLE!</div>";
            }
        }, 1000);
    </script>
</body>
</html>
